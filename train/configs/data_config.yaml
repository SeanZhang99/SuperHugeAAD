---
class_path: superhuge.data.interface.DInterface
init_args:
  dataloader_args:
    batch_size: 64
    drop_last: false
    num_workers: 1
    persistent_workers: true
    pin_memory: true
    prefetch_factor: 8
  dataset_class: superhuge.data.datasets.EegDataset
  fs: 128.0
  meta_filter_func:
    - class_path: superhuge.data.filters.MetadataValueSelector
      init_args:
        attribute_name: dataset_id
        attribute_value:
          # - 1 # AHU
          # - 2 # DTU
          # - 3 # Estart
          - 4 # KUL
          # - 5 # KUL-AV-GC
          # - 6 # NJU
          # - 7 # NUS
          # - 8 # PKU
          # - 9 # sparKULee
  metadata_fields:
    - dataset_id
    - subject_id
    - trial_id
    - signal_length
    - num_channel
    - fs
    - channel_infos
  overlap: 2
  root_path: /data/nvme/ssd2/zhangyuanming/EEG/derivatives/SuperHuge/
  preproc_stage: preprocessed
  transform:
    # - class_path: superhuge.data.transforms.Filter
    #   init_args:
    #     apply_prob: 1.0
    #     when: before_returning
    #     whom: eeg
    #     Wn: [1., 32.]
    #     btype: bandpass
    #     order: 5
    #     fs: ${init_args.fs}
    - class_path: superhuge.data.transforms.Scale
      init_args:
        apply_prob: 1.0
        when: before_returning
        whom: eeg
        root_path: ${init_args.root_path}
  window_length: 10
