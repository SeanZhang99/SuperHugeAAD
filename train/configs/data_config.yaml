---
class_path: superhuge.datasets.commons.data_interface.DInterface
init_args:
  dataloader_args:
    batch_size: 64
    drop_last: false
    num_workers: 1
    persistent_workers: true
    pin_memory: true
    prefetch_factor: 8
  dataset_class: superhuge.datasets.commons.eeg_dataset.EegDataset
  fs: 128
  meta_filter_func:
    - class_path: superhuge.datasets.metadata_processing.filters.MetadataValueSelector
      init_args:
        attribute_name: dataset_id
        attribute_value:
          # - 1 # AHU
          - 2 # DTU
          # - 3 # Estart
          - 4 # KUL
          # - 5 # KUL-AV-GC
          # - 6 # NJU
          # - 7 # NUS
          # - 8 # PKU
          # - 9 # sparKULee
  metadata_fields:
    - dataset_id
    - subject_id
    - trial_id
    - signal_length
    - num_channel
    - fs
    - channel_infos
  overlap: 2
  root_path: E:\derivatives\SuperHuge
  preproc_stage: preprocessed
  transform:
    - class_path: superhuge.utils.transforms.Filter
      init_args:
        apply_prob: 1.0
        when: before_returning
        whom: eeg
        Wn: [1., 32.]
        btype: bandpass
        order: 5
        fs: ${init_args.fs}
  window_length: 10
